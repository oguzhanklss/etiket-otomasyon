name: Windows build

# main'e her push'ta exe derlenir ve Actions sekmesinde artifact olarak sunulur.
# v* etiketi (örn. v1.0) push edilirse ayrıca herkese açık bir Release oluşturulur;
# arkadaşa gönderilecek link oradaki zip'tir.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"            # build.py Türkçe mesaj basıyor; cp1252'de patlamasın
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Derle ve zipla
        run: python build.py

      - name: Duman testi (exe var mı, boyut)
        shell: pwsh
        run: |
          $exe = "dist/EtiketYazdirma/EtiketYazdirma.exe"
          if (-not (Test-Path $exe)) { throw "exe üretilmedi" }
          Get-Item $exe, dist/EtiketYazdirma-windows.zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}
          if (-not (Test-Path dist/EtiketYazdirma/_internal/customtkinter/assets)) { throw "customtkinter assets pakete girmemiş" }

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: EtiketYazdirma-windows
          path: dist/EtiketYazdirma-windows.zip
          retention-days: 30

      - name: Release oluştur (sadece v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EtiketYazdirma-windows.zip
          generate_release_notes: true
